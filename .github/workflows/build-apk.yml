name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify Java environment
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"
        JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
        if [ "$JAVA_MAJOR" -lt 17 ]; then
          echo "ERROR: Java version is $JAVA_MAJOR, but Java 17 or newer is required."
          exit 1
        fi
        echo "Java major version verified: $JAVA_MAJOR"

    - name: Set up Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Create temporary debug keystore
      run: |
        if [ ! -f ./debug.keystore ]; then
          keytool -genkeypair \
            -v \
            -keystore ./debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi
        if [ ! -f ./debug.keystore ]; then
          echo "ERROR: debug.keystore was not created."
          exit 1
        fi
        echo "debug.keystore is ready."

    - name: Build debug APK
      run: gradle :app:assembleDebug --stacktrace --no-daemon

    - name: Verify APK output
      run: |
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "ERROR: app-debug.apk not found."
          echo "Searching inside app/build/outputs/apk..."
          find app/build/outputs/apk -type f -name "*.apk" || true
          echo "No debug APK was produced."
          exit 1
        fi
        echo "APK found: app/build/outputs/apk/debug/app-debug.apk"

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
